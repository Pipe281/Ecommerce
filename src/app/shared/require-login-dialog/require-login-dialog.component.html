<h2 mat-dialog-title>🔒 Iniciar sesión requerida</h2>

<mat-dialog-content>
  <p>Debes iniciar sesión para acceder a tu carrito de compras.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>

  <button mat-raised-button color="primary" [mat-dialog-close]="true">Iniciar sesión</button>
</mat-dialog-actions>
